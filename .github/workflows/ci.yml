name: CI

# Self-maintained plugin: verify tests, types, and that dist/ is committed in sync
# with src/. Releases to npm go through .github/workflows/publish.yml (OIDC).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build to dist/
        run: bun run build

      - name: Fail if committed dist/ is stale
        run: git diff --exit-code -- dist/
